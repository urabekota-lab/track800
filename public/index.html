<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover でノッチ周りの安全領域を env() から取れるようにする -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>Track800</title>
    <meta name="description" content="800m のための練習ノート。練習からいまの800mタイムを推定します。" />
    <meta name="theme-color" content="#1f2937" />

    <!--
      public/ の中身は書き出し先へそのままコピーされ、Expo によるパス書き換えは
      行われない。GitHub Pages は /track800/ のようなサブパスで配信されるため、
      絶対パス(/manifest.json)ではなく相対パスにしてルート配信でも両方動くようにする。
    -->
    <link rel="manifest" href="manifest.json" />

    <!-- iOS のホーム画面から起動したときにブラウザ UI を消して全画面にする -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Track800" />
    <!-- black-translucent にすると内容がステータスバーの下に潜り込むので default にする -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- react-native-web の推奨リセット -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* 端で引っぱったときのバウンドを止めて、アプリらしい手触りにする */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        background-color: #f6f7f9;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
    <div id="root"></div>
  </body>
</html>
